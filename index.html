<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>YZ官网</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css"
  onerror="this.onerror=null;var l=document.createElement('link');l.rel='stylesheet';l.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css';document.head.appendChild(l);" />
<style>
:root{--bg:#05070d;--line:rgba(255,255,255,.06);--line-soft:rgba(255,255,255,.04);--t1:#eef1fb;--t2:#98a1ba;--t3:#5a647c;--danger:#f87171;--ease:cubic-bezier(.22,.9,.28,1);--accent:#7a8cff;--accent2:#4fd1c5;--accent-soft:rgba(122,140,255,.14);--accent-line:rgba(122,140,255,.35);--accent-glow:rgba(122,140,255,.25);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:6px;background:var(--bg);color:var(--t1);font-family:"Inter","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased;background-image:radial-gradient(ellipse 60% 40% at 20% 5%,var(--accent-glow),transparent 60%),radial-gradient(ellipse 50% 40% at 85% 95%,rgba(79,209,197,.06),transparent 60%);background-attachment:fixed;}
::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-thumb{background:var(--accent-line);border-radius:4px;}
.phone{position:relative;width:100%;max-width:400px;background:rgba(10,14,24,.85);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border-radius:20px;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.7);overflow:hidden;min-height:calc(100vh - 12px);display:flex;flex-direction:column;}
.content{flex:1;padding:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.view{display:none;flex-direction:column;min-height:0;flex:1;}
.view.active{display:flex;animation:viewIn .28s var(--ease);}
@keyframes viewIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.scroll{overflow-y:auto;flex:1;padding-right:2px;scrollbar-width:thin;}

.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-shrink:0;gap:8px;}
.brand-l{display:flex;align-items:center;gap:10px;min-width:0;flex:1;cursor:pointer;}
.brand-logo{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent-soft),rgba(79,209,197,.08));border:1px solid var(--accent-line);box-shadow:0 4px 16px var(--accent-glow);font-size:17px;color:var(--accent);flex-shrink:0;overflow:hidden;}
.brand-logo img{width:100%;height:100%;object-fit:cover;}
.brand-txt{display:flex;flex-direction:column;min-width:0;}
.brand-txt b{font-size:18px;font-weight:800;background:linear-gradient(90deg,var(--t1) 30%,var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px;}
.brand-txt span{font-size:10px;color:var(--t3);letter-spacing:1.8px;font-weight:700;margin-top:1px;}
.brand-r{display:flex;gap:6px;flex-shrink:0;}
.icon-chip{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:14px;cursor:pointer;transition:.25s;font-family:inherit;padding:0;}
.icon-chip:hover{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);}
.icon-chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#05070d;border-color:transparent;box-shadow:0 4px 14px var(--accent-glow);}
.icon-chip.exit{color:#f87171;border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.1);}
.icon-chip.exit:hover{background:rgba(248,113,113,.22);color:#f87171;}

.notice{position:relative;background:rgba(255,255,255,.03);border-radius:12px;padding:11px 13px;border:1px solid var(--line-soft);font-size:11px;line-height:1.8;color:var(--t2);overflow:hidden;margin-bottom:12px;flex-shrink:0;transition:.2s;}
.notice::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:3px 0 0 3px;}
.admin-mode .notice-content{cursor:pointer;}
.admin-mode .notice:hover{border-color:var(--accent-line);background:rgba(255,255,255,.05);}
.notice-content{position:relative;z-index:1;padding-left:6px;white-space:pre-wrap;word-break:break-word;}
.notice strong{color:var(--t1);font-weight:800;}
.notice .small{font-size:9.5px;color:var(--t3);display:block;margin-top:4px;line-height:1.6;}
.notice .highlight{color:var(--accent);font-weight:700;}
.notice-img-wrap{position:relative;z-index:1;margin-top:10px;padding-left:6px;}
.notice-img{position:relative;cursor:zoom-in;border-radius:10px;overflow:hidden;}
.notice-img img{width:100%;display:block;border-radius:10px;border:1px solid var(--line-soft);}

.contact-row-big{display:flex;margin-top:10px;padding-left:6px;position:relative;z-index:1;}
.contact-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;padding-left:6px;position:relative;z-index:1;}
.contact-item{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.05);padding:6px 13px;border-radius:60px;border:1px solid var(--line-soft);transition:.25s;color:var(--accent);font-size:10.5px;font-weight:700;text-decoration:none;cursor:pointer;font-family:inherit;position:relative;user-select:none;}
.contact-item:hover{border-color:var(--accent-line);background:var(--accent-soft);transform:translateY(-1px);}
.contact-item:active{transform:scale(.97);}
.contact-item i{font-size:11px;}
.contact-item.big{width:100%;justify-content:center;padding:14px 20px;font-size:13.5px;font-weight:800;border-radius:12px;gap:8px;}
.contact-item.big i{font-size:16px;}
.cust-icon{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--accent-soft);}
.cust-icon img{width:100%;height:100%;object-fit:cover;}
.cust-icon i{font-size:9px;color:var(--accent);}
.edit-contact-btn{display:none;background:none;border:none;color:var(--accent);font-size:9px;cursor:pointer;padding:1px 3px;border-radius:4px;opacity:.7;font-family:inherit;}
.edit-contact-btn:hover{opacity:1;background:var(--accent-soft);}
.admin-mode .edit-contact-btn{display:inline-flex;}

.hero{position:relative;border-radius:16px;overflow:hidden;margin-bottom:11px;flex-shrink:0;min-height:128px;border:1px solid var(--accent-line);box-shadow:0 10px 30px rgba(0,0,0,.4);background:rgba(18,23,38,.65);touch-action:pan-y;}
.hero-track{display:flex;transition:transform .55s cubic-bezier(.22,.9,.28,1);height:100%;will-change:transform;}
.hero-slide{flex:0 0 100%;padding:15px;position:relative;overflow:hidden;min-height:128px;cursor:pointer;background:linear-gradient(135deg,var(--accent-soft) 0%,rgba(79,209,197,.08) 50%,rgba(122,140,255,.03) 100%),rgba(18,23,38,.65);}
.hero-slide::before{content:'';position:absolute;top:-60%;right:-30%;width:80%;height:200%;background:radial-gradient(circle,var(--accent-glow),transparent 60%);filter:blur(8px);pointer-events:none;}
.hero-tag{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:800;letter-spacing:1.1px;color:var(--accent2);padding:2px 8px;border-radius:20px;background:rgba(79,209,197,.12);border:1px solid rgba(79,209,197,.28);position:relative;z-index:2;}
.hero-title{font-size:19px;font-weight:900;margin-top:8px;letter-spacing:-.2px;position:relative;z-index:2;background:linear-gradient(120deg,var(--t1) 20%,var(--accent) 70%,var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hero-sub{font-size:10px;color:var(--t2);margin-top:4px;position:relative;z-index:2;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hero-badges{display:flex;gap:5px;margin-top:9px;position:relative;z-index:2;flex-wrap:wrap;}
.hb{font-size:8.5px;font-weight:700;padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--t2);}
.hb.hot{color:#f87171;background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.25);}
.hero-dots{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:3;max-width:85%;overflow:hidden;justify-content:center;}
.hero-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.25);cursor:pointer;transition:.3s;border:0;padding:0;flex-shrink:0;}
.hero-dot.active{width:14px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.hero-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:128px;color:var(--t3);font-size:11px;gap:5px;}
.hero-empty i{font-size:20px;opacity:.5;}

.search{display:flex;align-items:center;gap:9px;padding:9px 14px;margin-bottom:11px;background:rgba(255,255,255,.03);border:1px solid var(--line-soft);border-radius:20px;font-size:12px;flex-shrink:0;transition:.25s;}
.search:focus-within{border-color:var(--accent-line);box-shadow:0 0 18px var(--accent-glow);}
.search i{font-size:11px;color:var(--t3);}
.search input{flex:1;background:transparent;border:0;outline:0;color:var(--t1);font-size:12px;font-family:inherit;}
.search input::placeholder{color:var(--t3);}

.cats{display:flex;gap:6px;overflow-x:auto;margin-bottom:11px;padding-bottom:2px;scrollbar-width:none;flex-shrink:0;}
.cats::-webkit-scrollbar{display:none;}
.cat{padding:6px 13px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0;background:rgba(255,255,255,.035);border:1px solid var(--line-soft);color:var(--t2);cursor:pointer;transition:.2s;font-family:inherit;}
.cat.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#05070d;border-color:transparent;}

.sec{display:flex;align-items:center;gap:8px;margin-bottom:9px;padding:0 2px;flex-shrink:0;}
.sec::before{content:'';width:3px;height:13px;border-radius:2px;background:linear-gradient(180deg,var(--accent),var(--accent2));}
.sec b{font-size:13px;font-weight:800;}
.sec .cnt{font-size:9.5px;color:var(--t3);padding:1px 7px;border-radius:20px;background:rgba(255,255,255,.03);border:1px solid var(--line-soft);font-weight:700;}

.plist{display:flex;flex-direction:column;gap:8px;padding-bottom:8px;}
.pcard{position:relative;display:flex;align-items:center;gap:11px;padding:11px 12px;background:rgba(255,255,255,.035);border-radius:13px;cursor:pointer;transition:transform .25s var(--ease),background .25s;contain:layout style;}
.pcard:hover{transform:translateY(-1px);background:rgba(255,255,255,.06);}
.pcard:active{transform:scale(.99);}
.pcard-icon{width:44px;height:44px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent-soft),rgba(79,209,197,.06));border:1px solid var(--accent-line);color:var(--accent);font-size:17px;overflow:hidden;}
.pcard-icon img{width:100%;height:100%;object-fit:cover;}
.pcard-mid{flex:1;min-width:0;}
.pname-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.pname{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;}
.ptag{font-size:8.5px;font-weight:800;padding:1px 5px;border-radius:5px;}
.ptag.hot{color:#f87171;background:rgba(248,113,113,.14);border:1px solid rgba(248,113,113,.3);}
.ptag.pick{color:#fbbf24;background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.3);}
.psub{font-size:10px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pmeta{font-size:9px;color:var(--t3);margin-top:3px;display:flex;gap:8px;align-items:center;}
.pmeta i{font-size:8px;margin-right:2px;}
.pchev{color:var(--t3);font-size:10px;flex-shrink:0;transition:.2s;}
.pcard:hover .pchev{color:var(--accent);transform:translateX(2px);}
.empty-tip{text-align:center;color:var(--t3);padding:40px 0;font-size:12px;}
.foot-note{margin-top:10px;text-align:center;font-size:9.5px;color:var(--t3);padding-top:10px;letter-spacing:.3px;cursor:pointer;user-select:none;flex-shrink:0;}

.stats-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px;flex-shrink:0;}
.stat-mini{padding:8px 6px;border-radius:10px;text-align:center;background:rgba(255,255,255,.03);border:1px solid var(--line-soft);}
.stat-mini i{font-size:11px;color:var(--accent);}
.stat-mini b{display:block;font-size:13px;font-weight:900;margin-top:3px;color:var(--t1);}
.stat-mini span{display:block;font-size:8.5px;color:var(--t3);margin-top:1px;font-weight:600;}

.detail-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line-soft);flex-shrink:0;}
.back-btn{height:34px;border-radius:50px;background:rgba(255,255,255,.05);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--t2);cursor:pointer;transition:.2s;padding:0 12px;font-family:inherit;flex-shrink:0;gap:5px;}
.back-btn:hover{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);}
.detail-head b{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.dsec{margin-bottom:18px;flex-shrink:0;}
.dsec-title{display:flex;align-items:center;gap:7px;margin-bottom:9px;font-size:12px;font-weight:800;}
.dsec-title::before{content:'';width:3px;height:11px;border-radius:2px;background:linear-gradient(180deg,var(--accent),var(--accent2));}
.desc-box{padding:12px 14px;border-radius:12px;font-size:11px;line-height:1.85;color:var(--t2);background:rgba(255,255,255,.025);white-space:pre-wrap;word-break:break-word;}
.shots{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
.shots::-webkit-scrollbar{display:none;}
.shot{width:110px;height:196px;flex-shrink:0;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,var(--accent-soft),rgba(79,209,197,.06));border:1px solid var(--accent-line);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:20px;cursor:pointer;opacity:.9;transition:.2s;}
.shot:hover{transform:translateY(-2px);opacity:1;}
.shot img{width:100%;height:100%;object-fit:cover;}
.shot-empty{width:100%;height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--t3);font-size:10.5px;background:rgba(255,255,255,.02);border-radius:12px;}
.shot-empty i{font-size:18px;opacity:.5;}
.dl-card{display:flex;align-items:center;gap:10px;padding:11px 13px;margin-bottom:7px;background:rgba(255,255,255,.035);border-radius:12px;}
.dl-card:hover{background:rgba(255,255,255,.06);}
.dl-icon{width:32px;height:32px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;}
.dl-mid{flex:1;min-width:0;}
.dl-name{font-size:12px;font-weight:800;}
.dl-note{font-size:9.5px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dl-btn{padding:5px 14px;border-radius:16px;font-size:10.5px;font-weight:800;flex-shrink:0;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);cursor:pointer;font-family:inherit;}
.dl-btn:hover{background:var(--accent);color:#05070d;}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.link-btn{padding:11px 8px;border-radius:12px;font-size:11px;font-weight:800;background:rgba(255,255,255,.035);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:inherit;color:var(--t1);border:0;}
.link-btn:hover{background:var(--accent-soft);color:var(--accent);}
.link-btn i{font-size:12px;color:var(--accent);}
.link-btn.g i{color:var(--accent2);}
.link-btn.o i{color:#fb923c;}
.bottom-bar{padding:10px 0 2px;display:flex;gap:10px;align-items:center;flex-shrink:0;border-top:1px solid var(--line-soft);margin-top:8px;}
.bb-info{flex:1;min-width:0;}
.bb-info b{display:block;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bb-info span{font-size:9px;color:var(--t3);}
.btn-primary{padding:11px 22px;border-radius:20px;font-size:12px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#05070d;box-shadow:0 6px 20px var(--accent-glow);border:0;cursor:pointer;font-family:inherit;white-space:nowrap;}

.admin-head{position:relative;padding:13px;border-radius:13px;margin-bottom:11px;overflow:hidden;background:linear-gradient(135deg,var(--accent-soft),rgba(79,209,197,.06));border:1px solid var(--accent-line);flex-shrink:0;}
.admin-head-tag{display:inline-flex;align-items:center;gap:4px;font-size:8.5px;font-weight:800;letter-spacing:1.1px;color:var(--accent2);padding:2px 8px;border-radius:20px;background:rgba(79,209,197,.15);border:1px solid rgba(79,209,197,.3);position:relative;z-index:2;}
.admin-head b{display:block;font-size:15px;font-weight:900;margin-top:7px;position:relative;z-index:2;}
.admin-head span{display:block;font-size:10px;color:var(--t2);margin-top:4px;position:relative;z-index:2;}
.sync-status{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;color:var(--t3);margin-top:6px;position:relative;z-index:2;padding:2px 8px;border-radius:20px;background:rgba(0,0,0,.2);}
.sync-status .dot{width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 6px #34d399;animation:pulse 2s infinite;}
.sync-status .dot.off{background:#f87171;box-shadow:0 0 6px #f87171;}
.sync-status .dot.warn{background:#fbbf24;box-shadow:0 0 6px #fbbf24;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:13px;flex-shrink:0;}
.tool-item{padding:11px 10px;border-radius:11px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.035);cursor:pointer;font-family:inherit;color:var(--t1);text-align:left;border:0;}
.tool-item:hover{background:var(--accent-soft);}
.tool-item i{width:26px;height:26px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;background:rgba(255,255,255,.06);color:var(--accent);}
.tool-item.d i{background:rgba(248,113,113,.12);color:var(--danger);}
.tool-item.g i{background:rgba(79,209,197,.12);color:var(--accent2);}
.tool-item span{font-size:11px;font-weight:700;}
.mgmt-item{display:flex;align-items:center;gap:9px;padding:9px 11px;margin-bottom:6px;border-radius:11px;background:rgba(255,255,255,.03);}
.mgmt-icon{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent-soft),rgba(79,209,197,.06));display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:12px;flex-shrink:0;overflow:hidden;}
.mgmt-icon img{width:100%;height:100%;object-fit:cover;}
.mgmt-mid{flex:1;min-width:0;}
.mgmt-mid b{font-size:11.5px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mgmt-mid span{font-size:9px;color:var(--t3);}
.mgmt-acts{display:flex;gap:4px;flex-shrink:0;}
.mgmt-btn{padding:3px 8px;border-radius:7px;font-size:9px;font-weight:800;background:var(--accent-soft);color:var(--accent);border:0;cursor:pointer;font-family:inherit;}
.mgmt-btn:hover{background:var(--accent);color:#05070d;}
.mgmt-btn.d{background:rgba(248,113,113,.12);color:var(--danger);}

.overlay{position:fixed;inset:0;background:rgba(4,6,12,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:none;justify-content:center;align-items:center;z-index:9998;padding:20px;}
.overlay.active{display:flex;animation:fadeIn .2s ease;}
.overlay-card{max-width:400px;width:100%;padding:22px 20px 20px;background:rgba(17,22,38,.98);border-radius:20px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.7);animation:zoomIn .25s var(--ease);max-height:88vh;overflow-y:auto;position:relative;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes zoomIn{from{transform:scale(.94) translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
.edit-title{font-size:16px;font-weight:800;color:var(--t1);margin-bottom:5px;display:flex;align-items:center;gap:8px;}
.edit-title i{color:var(--accent);font-size:17px;}
.edit-sub{font-size:11px;color:var(--t3);margin-bottom:14px;line-height:1.55;}
.close-x{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.06);border:0;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;font-family:inherit;padding:0;}
.close-x:hover{background:rgba(248,113,113,.15);color:#f87171;}
.input-group{margin-bottom:10px;text-align:left;}
.input-group label{display:block;font-size:11px;font-weight:700;color:var(--t2);margin-bottom:4px;}
.input-group input,.input-group textarea,.input-group select{width:100%;padding:9px 13px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;color:var(--t1);font-size:12.5px;outline:none;font-family:inherit;}
.input-group textarea{resize:vertical;min-height:56px;line-height:1.55;}
.input-group input:focus,.input-group textarea:focus,.input-group select:focus{border-color:var(--accent-line);}
.input-group input::placeholder,.input-group textarea::placeholder{color:var(--t3);font-size:11.5px;}
.input-group select option{background:#111627;color:var(--t1);}
.pwd-error{color:var(--danger);font-size:11.5px;min-height:16px;margin-bottom:4px;text-align:center;}
.edit-btn-group{display:flex;gap:9px;margin-top:6px;}
.edit-btn-group button{flex:1;padding:11px 0;border:none;border-radius:50px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;}
.edit-save{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#05070d;}
.edit-cancel{background:rgba(255,255,255,.05);color:var(--t2);border:1px solid var(--line) !important;}

.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:4px;max-height:400px;overflow-y:auto;padding:2px;}
.color-dot{aspect-ratio:1;border-radius:50%;cursor:pointer;transition:.2s;border:2px solid transparent;position:relative;}
.color-dot:hover{transform:scale(1.12);}
.color-dot.active{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.4);}
.color-dot.active::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900;text-shadow:0 1px 4px rgba(0,0,0,.6);}
.color-group-title{grid-column:1/-1;font-size:10.5px;color:var(--t3);font-weight:700;padding:8px 0 2px;letter-spacing:.5px;}

.cat-mgr-list{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;min-height:30px;}
.cat-mgr-item{padding:6px 12px;background:rgba(255,255,255,.05);border-radius:16px;font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--t1);}
.cat-mgr-item .del{background:rgba(248,113,113,.15);color:#f87171;border:0;width:16px;height:16px;border-radius:50%;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;}
.cat-new-row{display:flex;gap:7px;}
.cat-new-row input{flex:1;padding:9px 13px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;color:var(--t1);font-size:12.5px;outline:none;font-family:inherit;}

.dyn-list{display:flex;flex-direction:column;gap:7px;}
.dyn-row{padding:9px;background:rgba(255,255,255,.03);border-radius:11px;}
.dyn-row .row-flex{display:flex;gap:6px;margin-bottom:5px;}
.dyn-row .row-flex>*{flex:1;min-width:0;}
.dyn-row input{width:100%;padding:7px 10px;background:rgba(255,255,255,.04);border:1px solid var(--line-soft);border-radius:8px;font-size:11.5px;color:var(--t1);outline:none;font-family:inherit;}
.dyn-row input:focus{border-color:var(--accent-line);}
.dyn-row input::placeholder{color:var(--t3);font-size:11px;}
.del-sm{flex:0 0 30px !important;background:rgba(248,113,113,.1) !important;color:var(--danger) !important;border:0 !important;border-radius:8px;cursor:pointer;font-family:inherit;font-size:11px;padding:0;}
.add-btn{padding:9px;background:var(--accent-soft);color:var(--accent);border:1px dashed var(--accent-line);border-radius:11px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:5px;display:flex;align-items:center;justify-content:center;gap:5px;width:100%;}
.add-btn:hover{background:var(--accent-line);}
.thumb-row{display:flex;gap:7px;flex-wrap:wrap;}
.thumb{width:58px;height:104px;border-radius:9px;overflow:hidden;position:relative;background:rgba(255,255,255,.03);}
.thumb img{width:100%;height:100%;object-fit:cover;}
.thumb .rm{position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:50%;background:rgba(248,113,113,.95);color:#fff;border:0;font-size:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;}
.upload-btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;background:var(--accent-soft);color:var(--accent);border:1px dashed var(--accent-line);border-radius:18px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
.upload-btn:hover{background:var(--accent-line);}
.upload-btn input{display:none;}
.preview-thumb{width:56px;height:56px;border-radius:11px;border:1px solid var(--line);background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;position:relative;}
.preview-thumb img{width:100%;height:100%;object-fit:cover;border-radius:11px;}
.preview-del{position:absolute;top:-6px;right:-6px;width:19px;height:19px;border-radius:50%;background:rgba(248,113,113,.95);color:#fff;border:2px solid #111627;font-size:9px;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0;font-family:inherit;font-weight:900;z-index:2;}
.preview-del.show{display:flex;}
.confirm-msg{font-size:12.5px;color:var(--t2);line-height:1.7;margin-bottom:6px;text-align:center;}
.confirm-msg strong{color:var(--accent);}

.ann-card{max-width:360px;text-align:center;}
.ann-icon{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:#05070d;font-size:24px;box-shadow:0 12px 36px var(--accent-glow);}
.ann-title-lg{font-size:17px;font-weight:900;color:var(--t1);margin-bottom:12px;}
.ann-body{font-size:12.5px;line-height:1.85;color:var(--t2);background:rgba(0,0,0,.25);padding:14px 16px;border-radius:14px;margin-bottom:14px;text-align:left;max-height:280px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;}
.ann-img{width:100%;border-radius:14px;margin-bottom:14px;display:none;border:1px solid var(--line-soft);}

.toast{position:fixed;top:40px;left:50%;transform:translateX(-50%);background:rgba(17,22,38,.97);backdrop-filter:blur(12px);padding:11px 20px;border-radius:14px;border:1px solid var(--accent-line);color:var(--t1);font-size:12.5px;font-weight:700;z-index:999999;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5);animation:toastIn .3s var(--ease),toastOut .3s ease 1.7s forwards;max-width:86vw;}
.toast small{display:block;font-size:10.5px;font-weight:400;color:var(--t2);margin-top:2px;}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-12px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
@keyframes toastOut{to{opacity:0;transform:translateX(-50%) translateY(-8px);}}

.img-popup{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:99999;display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;}
.img-popup.active{display:flex;}
.img-popup img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;}

.cust-wrap{max-width:340px;width:100%;background:rgba(17,22,38,.98);border-radius:18px;overflow:hidden;border:1px solid var(--line);}
.cust-wrap img{width:100%;display:block;max-height:60vh;object-fit:contain;}
.popup-actions{padding:10px 14px 14px;display:flex;gap:8px;}
.popup-actions button,.popup-actions label{flex:1;padding:10px 0;border:0;border-radius:30px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;}
.btn-save{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#05070d;}
.btn-close-popup{background:rgba(255,255,255,.07);color:var(--t2);}
.popup-actions input{display:none;}
@media(max-width:420px){.phone{border-radius:16px;}.content{padding:12px;}}
</style>
</head>
<body>

<!-- 密码 -->
<div class="overlay" id="pwdOverlay">
  <div class="overlay-card" style="max-width:320px;">
    <button class="close-x" id="pwdCloseX"><i class="fas fa-times"></i></button>
    <div class="edit-title" style="justify-content:center;"><i class="fas fa-shield-halved"></i> 管理员验证</div>
    <div class="edit-sub" style="text-align:center;">请输入管理员密码</div>
    <div class="input-group"><input type="password" id="pwdInput" placeholder="••••••" maxlength="20" autocomplete="off" style="text-align:center;letter-spacing:6px;font-size:15px;padding:12px;" /></div>
    <div class="pwd-error" id="pwdErr"></div>
    <div class="edit-btn-group"><button class="edit-cancel" id="pwdCancel">取消</button><button class="edit-save" id="pwdOk">确认</button></div>
  </div>
</div>

<!-- 改密 -->
<div class="overlay" id="chPwdOverlay">
  <div class="overlay-card">
    <button class="close-x" id="chPwdCloseX"><i class="fas fa-times"></i></button>
    <div class="edit-title"><i class="fas fa-key"></i> 修改密码</div>
    <div class="edit-sub">仅本设备生效</div>
    <div class="input-group"><label>旧密码</label><input type="password" id="oldPwd" maxlength="20" /></div>
    <div class="input-group"><label>新密码（至少6位）</label><input type="password" id="newPwd" maxlength="20" /></div>
    <div class="input-group"><label>确认新密码</label><input type="password" id="cfPwd" maxlength="20" /></div>
    <div class="pwd-error" id="chPwdErr"></div>
    <div class="edit-btn-group"><button class="edit-cancel" id="chPwdCancel">取消</button><button class="edit-save" id="chPwdOk">确认</button></div>
  </div>
</div>

<!-- 云同步 -->
<div class="overlay" id="cloudOverlay">
  <div class="overlay-card">
    <button class="close-x" id="cloudCloseX"><i class="fas fa-times"></i></button>
    <div class="edit-title"><i class="fas fa-cloud"></i> 云同步</div>
    <div class="edit-sub">GitHub Gist · 所有接入者实时同步</div>
    <div class="input-group"><label>Gist URL 或 ID</label><input type="text" id="cfgGist" placeholder="https://gist.github.com/..." /></div>
    <div class="input-group"><label>GitHub Token</label><input type="password" id="cfgToken" placeholder="ghp_xxxxxxxx" /></div>
    <button class="add-btn" id="cfgSave"><i class="fas fa-flask"></i> 测试并保存</button>
    <div style="height:1px;background:var(--line-soft);margin:14px 0;"></div>
    <div class="input-group"><label>分享码</label><textarea id="cfgShare" rows="2" placeholder="YZ1-xxxxx" style="font-family:monospace;font-size:11px;"></textarea></div>
    <div style="display:flex;gap:7px;">
      <button class="add-btn" id="cfgImport" style="flex:1;margin-top:0;"><i class="fas fa-file-import"></i> 导入</button>
      <button class="add-btn" id="cfgGen" style="flex:1;margin-top:0;"><i class="fas fa-qrcode"></i> 生成</button>
    </div>
    <div class="pwd-error" id="cfgErr" style="margin-top:8px;"></div>
    <div class="edit-btn-group"><button class="edit-cancel" id="cfgClear" style="color:var(--danger);">清除配置</button></div>
  </div>
</div>

<!-- 编辑项目 -->
<div class="overlay" id="projOverlay">
  <div class="overlay-card">
    <button class="close-x" id="projCloseX"><i class="fas fa-times"></i></button>
    <div class="edit-title" id="projTitle"><i class="fas fa-pen"></i> 编辑项目</div>
    <div class="edit-sub" id="projSub">修改项目信息</div>
    <div class="input-group"><label>项目名称 *</label><input type="text" id="pName" /></div>
    <div class="input-group"><label>副标题</label><input type="text" id="pSub" /></div>
    <div style="display:flex;gap:9px;">
      <div class="input-group" style="flex:1;"><label>版本号</label><input type="text" id="pVer" /></div>
      <div class="input-group" style="flex:1;"><label>更新日期</label><input type="date" id="pDate" /></div>
    </div>
    <div class="input-group"><label>分类</label><select id="pCat"></select></div>
    <div class="input-group" style="display:flex;gap:14px;align-items:center;">
      <label style="display:flex;align-items:center;gap:5px;margin:0;cursor:pointer;font-size:11.5px;color:var(--t2);"><input type="checkbox" id="pTop" style="width:auto;accent-color:var(--accent);" /> 顶</label>
      <label style="display:flex;align-items:center;gap:5px;margin:0;cursor:pointer;font-size:11.5px;color:var(--t2);"><input type="checkbox" id="pFeat" style="width:auto;accent-color:var(--accent);" /> 精（轮播）</label>
    </div>
    <div class="input-group"><label>图标</label>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <label class="upload-btn">📷 上传<input type="file" id="pIconInput" accept="image/*" /></label>
        <div class="preview-thumb" id="pIconPreview"><img id="pIconImg" alt="" /><button type="button" class="preview-del" id="pIconDel">✕</button></div>
      </div>
    </div>
    <div class="input-group"><label>简介</label><textarea id="pDesc" rows="3"></textarea></div>
    <div class="input-group"><label>功能图（多张）</label>
      <div class="thumb-row" id="pShots"></div>
      <label class="upload-btn" style="margin-top:7px;">📷 添加图片<input type="file" id="pShotInput" accept="image/*" multiple /></label>
    </div>
    <div class="input-group"><label>下载链接</label>
      <div class="dyn-list" id="pDls"></div>
      <button type="button" class="add-btn" id="pDlAdd"><i class="fas fa-plus"></i> 添加下载链接</button>
    </div>
    <div class="input-group"><label>官方群链接</label><input type="text" id="pGroup" placeholder="https://..." /></div>
    <div class="input-group"><label>官方频道链接</label><input type="text" id="pChannel" placeholder="https://..." /></div>
    <div class="edit-btn-group"><button class="edit-cancel" id="projCancel">取消</button><button class="edit-save" id="projSave">保存</button></div>
    <button class="add-btn" id="projDelete" style="margin-top:9px;color:var(--danger);border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.08);display:none;">删除此项目</button>
  </div>
</div>

<!-- 主题 -->
<div class="overlay" id="themeOverlay">
  <div class="overlay-card" style="max-width:460px;">
    <button class="close-x" id="themeCloseX"><i class="fas fa-times"></i></button>
    <div class="edit-title"><i class="fas fa-palette"></i> 主题色板</div>
    <div class="edit-sub">32 大类 · 192 款配色 · 选择后自动同步给所有用户</div>
    <div class="color-grid" id="themeColors"></div>
    <div class="edit-btn-group"><button class="edit-cancel" id="themeClose" style="margin-top:12px;">关闭</button></div>
  </div>
</div>

<!-- 分类管理 -->
<div class="overlay" id="catOverlay">
  <div class="overlay-card">
    <button class="close-x" id="catCloseX"><i class="fas fa-times"></i></button>
    <div class="edit-title"><i class="fas fa-tags"></i> 分类管理</div>
    <div class="edit-sub">添加或删除分类</div>
    <div class="cat-mgr-list" id="catMgrList"></div>
    <div class="cat-new-row">
      <input type="text" id="catNewInput" placeholder="输入新分类名称" />
      <button class="add-btn" id="catAddBtn" style="width:auto;padding:9px 16px;margin-top:0;"><i class="fas fa-plus"></i> 添加</button>
    </div>
    <div class="pwd-error" id="catErr"></div>
    <div class="edit-btn-group"><button class="edit-cancel" id="catClose">关闭</button></div>
  </div>
</div>

<!-- 通用编辑（品牌+Logo / YZ公告 / 弹窗公告 / 底部 / 链接） -->
<div class="overlay" id="genOverlay">
  <div class="overlay-card">
    <button class="close-x" id="genCloseX"><i class="fas fa-times"></i></button>
    <div class="edit-title" id="genTitle">编辑</div>
    <div class="edit-sub" id="genSub">修改内容</div>
    <div class="input-group" id="genTitleGroup" style="display:none;"><label>标题</label><input type="text" id="genTitleInput" /></div>
    <div class="input-group" id="genLogoGroup" style="display:none;">
      <label>自定义Logo（可选）</label>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <label class="upload-btn">📷 上传Logo<input type="file" id="genLogoInput" accept="image/*" /></label>
        <div class="preview-thumb" id="genLogoPreview"><img id="genLogoEl" alt="" /><button type="button" class="preview-del" id="genLogoDel">✕</button></div>
      </div>
    </div>
    <div class="input-group"><label id="genLabel">内容</label><textarea id="genValue" rows="4"></textarea></div>
    <div class="input-group" id="genImgGroup" style="display:none;">
      <label>公告图片（可选）</label>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <label class="upload-btn">📷 上传图片<input type="file" id="genImgInput" accept="image/*" /></label>
        <div class="preview-thumb" id="genImgPreview"><img id="genImgEl" alt="" /><button type="button" class="preview-del" id="genImgDel">✕</button></div>
      </div>
    </div>
    <div class="edit-btn-group"><button class="edit-cancel" id="genCancel">取消</button><button class="edit-save" id="genSave">保存</button></div>
  </div>
</div>

<!-- 确认 -->
<div class="overlay" id="confirmOverlay">
  <div class="overlay-card">
    <div class="edit-title" style="justify-content:center;"><i class="fas fa-triangle-exclamation" style="color:var(--danger);"></i> 确认</div>
    <div class="confirm-msg" id="confirmMsg">确定？</div>
    <div class="edit-btn-group"><button class="edit-cancel" id="confirmCancel">取消</button><button class="edit-save" id="confirmOk" style="background:linear-gradient(135deg,var(--danger),#fb923c);">确定</button></div>
  </div>
</div>

<!-- 公告弹窗 -->
<div class="overlay" id="annOverlay">
  <div class="overlay-card ann-card">
    <div class="ann-icon"><i class="fas fa-bullhorn"></i></div>
    <div class="ann-title-lg" id="annTitle">📢 公告</div>
    <div class="ann-body" id="annBody"></div>
    <img class="ann-img" id="annImage" alt="" />
    <button class="edit-save" id="annConfirm" style="width:100%;padding:12px 0;border:0;border-radius:50px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#05070d;">我知道了</button>
  </div>
</div>

<!-- 客服 -->
<div class="overlay" id="custOverlay"><div class="cust-wrap" id="custContent"></div></div>

<!-- 图片预览 -->
<div class="img-popup" id="imgPreviewModal"><img id="imgPreviewSrc" alt="" /></div>

<!-- 手机壳 -->
<div class="phone">
  <div class="content">

    <!-- 首页 -->
    <section class="view active" id="viewHome">
      <div class="brand">
        <div class="brand-l" id="brandClickArea">
          <div class="brand-logo" id="brandLogoWrap"><i class="fas fa-crown"></i></div>
          <div class="brand-txt">
            <b id="brandText">YZ官网</b>
            <span id="brandTagline">BALLS · 精选</span>
          </div>
        </div>
        <div class="brand-r">
          <button class="icon-chip" id="adminBtn" title="管理员模式"><i class="fas fa-lock"></i></button>
          <button class="icon-chip exit" id="exitAdminBtn" title="退出管理员" style="display:none;"><i class="fas fa-right-from-bracket"></i></button>
        </div>
      </div>

      <div class="scroll">
        <div class="notice" id="noticeBox">
          <div class="notice-content" id="noticeContent"></div>
          <div class="notice-img-wrap" id="noticeImgWrap" style="display:none;">
            <div class="notice-img" id="noticeImgBox"><img id="noticeImgEl" alt="" /></div>
          </div>
          
          <!-- 24H下单：大长按钮独占一行 -->
          <div class="contact-row-big">
            <div class="contact-item big" id="contactShop" role="button" tabindex="0">
              <i class="fas fa-clock"></i> <span>24H自助下单</span>
              <span class="edit-contact-btn" data-contact="shop"><i class="fas fa-pen"></i></span>
            </div>
          </div>
          
          <!-- 客服和教程下载：小按钮同行 -->
          <div class="contact-row">
            <button class="contact-item" id="contactCust">
              <span class="cust-icon" id="yzIconContainer"><i class="fas fa-headset"></i></span>
              <span>YZ客服</span>
            </button>
            <div class="contact-item" id="contactDownload" role="button" tabindex="0">
              <i class="fas fa-download"></i> <span>教程下载</span>
              <span class="edit-contact-btn" data-contact="download"><i class="fas fa-pen"></i></span>
            </div>
          </div>
        </div>

        <div class="hero" id="hero">
          <div class="hero-track" id="heroTrack"></div>
          <div class="hero-dots" id="heroDots"></div>
        </div>

App.sha256 = function(input){
  var ascii=unescape(encodeURIComponent(input));
  function rr(v,a){return (v>>>a)|(v<<(32-a));}
  var mp=Math.pow,mw=mp(2,32),res='';
  var words=[],bl=ascii.length*8;
  var h=App.sha256.h=App.sha256.h||[],k=App.sha256.k=App.sha256.k||[],pc=k.length,ic={};
  for(var c=2;pc<64;c++){ if(!ic[c]){ for(var i=0;i<313;i+=c)ic[i]=c; h[pc]=(mp(c,.5)*mw)|0; k[pc++]=(mp(c,1/3)*mw)|0; } }
  ascii+='\x80'; while(ascii.length%64-56)ascii+='\x00';
  for(var i2=0;i2<ascii.length;i2++){ var j=ascii.charCodeAt(i2); if(j>>8)return ''; words[i2>>2]|=j<<((3-i2)%4)*8; }
  words[words.length]=(bl/mw)|0; words[words.length]=bl;
  for(var j2=0;j2<words.length;){ var w=words.slice(j2,j2+=16),oh=h; h=h.slice(0,8);
    for(var i3=0;i3<64;i3++){ var w15=w[i3-15],w2=w[i3-2],a=h[0],e=h[4];
      var t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^((~e)&h[6]))+k[i3]+(w[i3]=i3<16?w[i3]:(w[i3-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i3-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));
      h=[(t1+t2)|0].concat(h); h[4]=(h[4]+t1)|0; }
    for(var i4=0;i4<8;i4++)h[i4]=(h[i4]+oh[i4])|0; }
  for(var i5=0;i5<8;i5++)for(var j3=3;j3+1;j3--){ var b=(h[i5]>>(j3*8))&255; res+=(b<16?'0':'')+b.toString(16); }
  return res;
};
const DEFAULT_PWD_HASH = App.sha256(PWD_SALT + '147258');
App.getPwdHash = () => localStorage.getItem('adminPwdHash') || DEFAULT_PWD_HASH;
App.setPwdHash = h => localStorage.setItem('adminPwdHash', h);
App.checkPwd = function(p){
  const salted = App.sha256(PWD_SALT + p);
  if(salted === App.getPwdHash()) return true;
  const legacy = App.sha256(p);
  if(legacy === App.getPwdHash()){ App.setPwdHash(salted); return true; }
  return false;
};

const DB_NAME='yz_db',DB_VER=1;
let db=null,dbOk=true;

App.openDB=()=>new Promise(res=>{

});
App.dbGet=(s,k)=>{ if(!dbOk)return Promise.resolve(memStore.get(s+'_'+k)||''); return new Promise(res=>{ try{const r=db.transaction(s,'readonly').objectStore(s).get(k);r.onsuccess=()=>res(r.result||'');r.onerror=()=>res('');}catch(e){res('');} }); };
App.dbSet=(s,k,v)=>{ if(!dbOk){memStore.set(s+'_'+k,v);return Promise.resolve();} return new Promise(res=>{ try{const t=db.transaction(s,'readwrite');t.objectStore(s).put(v,k);t.oncomplete=()=>res();t.onerror=()=>res();}catch(e){res();} }); };
App.dbDel=(s,k)=>{ if(!dbOk){memStore.delete(s+'_'+k);return Promise.resolve();} return new Promise(res=>{ try{const t=db.transaction(s,'readwrite');t.objectStore(s).delete(k);t.oncomplete=()=>res();t.onerror=()=>res();}catch(e){res();} }); };
App.dbDump=s=>{ if(!dbOk){const o={};memStore.forEach((v,k)=>{if(k.indexOf(s+'_')===0)o[k.slice(s.length+1)]=v;});return Promise.resolve(o);} return new Promise(res=>{ try{ const st=db.transaction(s,'readonly').objectStore(s); const kr=st.getAllKeys(),vr=st.getAll(); let keys=[],vals=[]; kr.onsuccess=()=>{keys=kr.result||[];}; vr.onsuccess=()=>{vals=vr.result||[];const o={};for(let i=0;i<keys.length;i++)o[keys[i]]=vals[i];res(o);}; kr.onerror=vr.onerror=()=>res({}); }catch(e){res({});} }); };
App.dbClear=s=>{ if(!dbOk){[...memStore.keys()].forEach(k=>{if(k.indexOf(s+'_')===0)memStore.delete(k);});return Promise.resolve();} return new Promise(res=>{ try{const t=db.transaction(s,'readwrite');t.objectStore(s).clear();t.oncomplete=()=>res();t.onerror=()=>res();}catch(e){res();} }); };

App.supportsWebP=(function(){let c;return()=>{if(c!==undefined)return c;try{const cv=document.createElement('canvas');cv.width=cv.height=1;c=cv.toDataURL('image/webp').indexOf('data:image/webp')===0;}catch(e){c=false;}return c;};})();
App.compress=(file,opt)=>{
  opt=Object.assign({maxSize:900,quality:.92,targetSize:0,minSize:240}, opt||{});
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        const r=opt.maxSize/Math.max(w,h);
        if(r<1){ w=Math.round(w*r); h=Math.round(h*r); }
        const cv=document.createElement('canvas');
        const ctx=cv.getContext('2d');
        const mime=App.supportsWebP()?'image/webp':'image/jpeg';
        function draw(W,H){ cv.width=W; cv.height=H; ctx.clearRect(0,0,W,H); ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high'; ctx.drawImage(img,0,0,W,H); }
        let out='',q=opt.quality;
        while(q>=0.55){ draw(w,h); out=cv.toDataURL(mime,q); if(!opt.targetSize||out.length<=opt.targetSize) break; q-=0.05; }
        while(opt.targetSize && out.length>opt.targetSize && w>opt.minSize){ w=Math.max(opt.minSize,Math.round(w*0.85)); h=Math.max(opt.minSize,Math.round(h*0.85)); draw(w,h); out=cv.toDataURL(mime,0.82); }
        if(opt.targetSize && out.length>opt.targetSize){ let lo=0.45,hi=0.82; for(let i=0;i<6;i++){ const mid=(lo+hi)/2; const t=cv.toDataURL(mime,mid); if(t.length>opt.targetSize) hi=mid; else { lo=mid; out=t; } } }
        res(out);
      };
      img.onerror=rej; img.src=e.target.result;
    };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
};

async function sweepProjectShots(key, newShots){

}

/* ========== 云同步 ========== */
App.Cloud = {
  _id:'',_owner:'',_token:'',
  _timer:null,_uploading:false,_lastVer:0,_init:false,_err:null,
  _etag:null,_pollTimer:null,_checking:false,_lastUploadHash:'',
  load(){ this._id=localStorage.getItem('gh_id')||DEFAULT_GIST_ID||''; this._owner=localStorage.getItem('gh_owner')||DEFAULT_GIST_OWNER||''; this._token=localStorage.getItem('gh_token')||''; },
  save(id,o,t){ if(id)localStorage.setItem('gh_id',id); else localStorage.removeItem('gh_id'); if(o)localStorage.setItem('gh_owner',o); else localStorage.removeItem('gh_owner'); if(t)localStorage.setItem('gh_token',t); else localStorage.removeItem('gh_token'); this.load(); },
  clear(){ ['gh_id','gh_owner','gh_token'].forEach(k=>localStorage.removeItem(k)); this.load(); },
  hasCfg(){ return !!this._id; },
  canWrite(){ return !!(this._id && this._token); },
  parseGist(s){ s=String(s||'').trim(); if(!s) return {id:'',owner:''}; const m=s.match(/gist\.github\.com\/([^\/]+)\/([a-f0-9]+)/i); if(m) return {owner:m[1],id:m[2]}; if(/^[a-f0-9]+$/i.test(s)) return {id:s,owner:''}; return {id:'',owner:''}; },
  async collect(){
    return {
      _v:20, updatedAt: Date.now(),
      projects: App.Storage.get('projects',{}),
      order: App.Storage.get('order',[]),
      categories: App.Storage.get('categories',[]),
      brandName: localStorage.getItem('brandName')||'',
      brandLogo: localStorage.getItem('brandLogo')||'',
      brandTagline: localStorage.getItem('brandTagline')||'',
      noticeContent: localStorage.getItem('noticeContent')||'',
      footNote: localStorage.getItem('footNote')||'',
      announcementData: localStorage.getItem('announcementData')||'',
      themeData: localStorage.getItem('themeData')||'',
      shopLink: localStorage.getItem('shopContactLink')||'',
      downloadLink: localStorage.getItem('downloadContactLink')||'',
      images: await App.dbDump('images')
    };
  },
  schedule(){ if(!CLOUD_ENABLED||!this.canWrite())return; clearTimeout(this._timer); const s=this; this._timer=setTimeout(()=>s.upload(),UPLOAD_DEBOUNCE); },
  async upload(){
    if(!CLOUD_ENABLED)return;
    this.load();
    if(!this.canWrite()||this._uploading)return;
    this._uploading=true;
    this.setSync('uploading');
    try{
      const data=await this.collect();
      const content=JSON.stringify(data);
      let hash=0;
      for(let i=0;i<content.length;i+=512){ hash=((hash<<5)-hash+content.charCodeAt(i))|0; }
      if(hash===this._lastUploadHash){ this._uploading=false; this.setSync('ok'); return; }
      const r=await fetch(GIST_API+this._id,{
        method:'PATCH',
        headers:{'Authorization':'token '+this._token,'Content-Type':'application/json','Accept':'application/vnd.github+json'},
        body:JSON.stringify({files:{[GIST_FILENAME]:{content}}})
      });
      if(r.ok){
        this._lastVer=data.updatedAt;
        this._lastUploadHash=hash;
        this._err=null;
        this._etag=null;
        this.setSync('ok');
        if(bc) bc.postMessage({type:'updated',ts:Date.now()});
      }else{ this._err='HTTP '+r.status; this.setSync('error'); }
    }catch(e){ this._err=e.message; this.setSync('error'); }
    this._uploading=false;
  },
  setSync(state){
    const dot=$('syncDot'), txt=$('syncText');
    if(!dot||!txt)return;
    dot.classList.remove('off','warn');
    if(state==='uploading') txt.textContent='正在上传...';
    else if(state==='ok') txt.textContent='实时同步已开启';
    else if(state==='readonly'){ dot.classList.add('warn'); txt.textContent='只读模式'; }
    else if(state==='noconfig'){ dot.classList.add('warn'); txt.textContent='未配置云同步'; }
    else { dot.classList.add('off'); txt.textContent='同步失败'; }
  },
  async fetch(){
    this.load();
    if(!this.hasCfg())return null;
    if(this._owner){
      const url='https://gist.githubusercontent.com/'+this._owner+'/'+this._id+'/raw/'+GIST_FILENAME+'?t='+Date.now();
      const r=await fetch(url,{cache:'no-store'});
      if(r.ok){ try{ return JSON.parse(await r.text()); }catch(e){ return null; } }
    }
    const headers={'Accept':'application/vnd.github+json'};
    if(this._token)headers['Authorization']='token '+this._token;
    const r=await fetch(GIST_API+this._id+'?t='+Date.now(),{cache:'no-store',headers});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const o=await r.json();
    const f=o.files&&o.files[GIST_FILENAME];
    if(!f)return null;
    if(f.truncated&&f.raw_url){ const rr=await fetch(f.raw_url+'?t='+Date.now()); return await rr.json(); }
    try{ return JSON.parse(f.content); }catch(e){ return null; }
  },
  async checkLight(){
    if(!this.hasCfg()||this._checking)return false;
    this._checking=true;
    try{
      if(this._token){
        const headers={'Accept':'application/vnd.github+json','Authorization':'token '+this._token};
        if(this._etag)headers['If-None-Match']=this._etag;
        const r=await fetch(GIST_API+this._id,{headers,cache:'no-store'});
        if(r.status===304){ this._checking=false; return false; }
        if(!r.ok){ this._checking=false; return false; }
        const etag=r.headers.get('ETag'); if(etag)this._etag=etag;
        const obj=await r.json();
        const files=obj.files||{};
        const remoteLatest=Object.values(files).reduce((a,f)=>Math.max(a,new Date(f.updated_at||0).getTime()),0);
        this._checking=false;
        if(remoteLatest>this._lastVer+300)return await this.pullAndApply();
        return false;
      }else{
        const data=await this.fetch();
        this._checking=false;
        if(data&&data.updatedAt&&data.updatedAt>this._lastVer+300){
          await this.apply(data); await loadImages(); renderAll();
          App.toast('🔄 内容已更新');
          return true;
        }
        return false;
      }
    }catch(e){ this._checking=false; return false; }
  },
  async pullAndApply(){
    try{
      const data=await this.fetch();
      if(data&&data.updatedAt&&data.updatedAt>this._lastVer){
        await this.apply(data); await loadImages(); renderAll();
        return true;
      }
    }catch(e){}
    return false;
  },
  async apply(data){
    if(!data||typeof data!=='object')return;
    App.Storage.set('projects',data.projects||{});
    App.Storage.set('order',data.order||[]);
    if(data.categories) App.Storage.set('categories',data.categories);
    if(data.brandName!==undefined)localStorage.setItem('brandName',data.brandName);
    if(data.brandLogo!==undefined)localStorage.setItem('brandLogo',data.brandLogo);
    if(data.brandTagline!==undefined)localStorage.setItem('brandTagline',data.brandTagline);
    if(data.noticeContent!==undefined)localStorage.setItem('noticeContent',data.noticeContent);
    if(data.footNote!==undefined)localStorage.setItem('footNote',data.footNote);
    if(data.announcementData!==undefined)localStorage.setItem('announcementData',data.announcementData);
    if(data.themeData)localStorage.setItem('themeData',data.themeData);
    if(data.shopLink!==undefined)localStorage.setItem('shopContactLink',data.shopLink);
    if(data.downloadLink!==undefined)localStorage.setItem('downloadContactLink',data.downloadLink);
    await App.dbClear('images');
    Object.keys(imgCache).forEach(k=>delete imgCache[k]);
    const jobs=[];
    Object.keys(data.images||{}).forEach(k=>{ imgCache[k]=data.images[k]; jobs.push(App.dbSet('images',k,data.images[k])); });
    await Promise.all(jobs);
    this._lastVer=data.updatedAt||Date.now();
  },
  async init(){
    if(!CLOUD_ENABLED)return;
    this.load();
    if(!this.hasCfg()){ this.setSync('noconfig'); this._init=true; return; }
    try{
      const d=await this.fetch();
      const has=d&&d.updatedAt&&(Object.keys(d.projects||{}).length||d.brandName);
      if(has){ await this.apply(d); }
      else if(Object.keys(App.Storage.get('projects',{})).length&&this.canWrite()){ await this.upload(); }
      else this.setSync(this.canWrite()?'ok':'readonly');
    }catch(e){ this._err=e.message; this.setSync('error'); }
    this._init=true;
    this.startPolling();
  },
  startPolling(){
    if(!this.hasCfg())return;
    if(this._pollTimer)clearInterval(this._pollTimer);
    const s=this;
    const interval=this.canWrite()?POLL_FAST:POLL_SLOW;
    this._pollTimer=setInterval(()=>s.checkLight(),interval);
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden)s.checkLight(); });
    window.addEventListener('focus',()=>s.checkLight());
    window.addEventListener('online',()=>s.checkLight());
    if(bc){ bc.onmessage=(e)=>{ if(e.data&&e.data.type==='updated'){ s._lastVer=0; s.checkLight(); } }; }
  },
  async testSave(input,token){
    const p=this.parseGist(input);
    if(!p.id)throw new Error('无法解析 Gist ID');
    if(!token)throw new Error('请填写 Token');
    let owner=p.owner;
    if(!owner){
      const r=await fetch(GIST_API+p.id,{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github+json'}});
      if(!r.ok)throw new Error('读取失败 HTTP '+r.status);
      const o=await r.json(); owner=o.owner&&o.owner.login;
    }
    const t=await fetch(GIST_API+p.id,{
      method:'PATCH',
      headers:{'Authorization':'token '+token,'Content-Type':'application/json','Accept':'application/vnd.github+json'},
      body:JSON.stringify({description:'YZ 数据'})
    });
    if(!t.ok){
      if(t.status===401)throw new Error('Token 无效');
      if(t.status===404)throw new Error('Gist 不存在');
      throw new Error('写入失败 HTTP '+t.status);
    }
    this.save(p.id,owner||'',token);
  },
  genShareCode(){
    if(!this._id||!this._token)return '';
    const raw=this._id+'|'+(this._owner||'')+'|'+this._token;
    const b64=btoa(unescape(encodeURIComponent(raw))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    return 'YZ1-'+b64;
  },
  parseShareCode(code){
    code=String(code||'').trim();
    if(code.indexOf('YZ1-')!==0)return null;
    let b64=code.slice(4).replace(/-/g,'+').replace(/_/g,'/');
    while(b64.length%4)b64+='=';
    try{
      const raw=decodeURIComponent(escape(atob(b64)));
      const p=raw.split('|');
      if(p.length<3)return null;
      return {id:p[0],owner:p[1],token:p[2]};
    }catch(e){return null;}
  },
  importShare(code){
    const c=this.parseShareCode(code);
    if(!c)throw new Error('分享码格式错误');
    this.save(c.id,c.owner,c.token);
  }
};

function detectNetdisk(url){
  const u=String(url||'').toLowerCase();
  if(!u)return{name:'未设置',icon:'fa-link',color:'#5a647c'};
  if(u.includes('pan.baidu.com'))return{name:'百度网盘',icon:'fa-cloud',color:'#3b82f6'};
  if(/lanzou[a-z]*\.(com|cn)/.test(u))return{name:'蓝奏云',icon:'fa-bolt',color:'#22a6ff'};
  if(u.includes('alipan.com')||u.includes('aliyundrive.com'))return{name:'阿里云盘',icon:'fa-cloud',color:'#5b7cff'};
  if(u.includes('pan.quark.cn'))return{name:'夸克网盘',icon:'fa-meteor',color:'#5468ff'};
  if(u.includes('123pan.com'))return{name:'123云盘',icon:'fa-cloud',color:'#2b6cff'};
  if(u.includes('cloud.189.cn'))return{name:'天翼云盘',icon:'fa-cloud',color:'#0077ff'};
  if(u.includes('xunlei.com'))return{name:'迅雷',icon:'fa-bolt',color:'#00a8e8'};
  if(u.includes('weiyun.com'))return{name:'腾讯微云',icon:'fa-cloud',color:'#12b7f5'};
  if(u.includes('caiyun.139.com'))return{name:'移动云盘',icon:'fa-cloud',color:'#ff6a00'};
  if(u.includes('drive.uc.cn'))return{name:'UC网盘',icon:'fa-cloud',color:'#ff6a00'};
  if(u.includes('115.com'))return{name:'115网盘',icon:'fa-cloud',color:'#0099ff'};
  if(u.includes('pan.'))return{name:'网盘',icon:'fa-cloud',color:'#6366f1'};
  if(/\.(zip|apk|exe|rar|7z|dmg|ipa|tar|gz)(\?|$|#)/.test(u))return{name:'直链',icon:'fa-download',color:'#10b981'};
  if(u.startsWith('http'))return{name:'网页',icon:'fa-globe',color:'#6b7280'};
  return{name:'其他',icon:'fa-link',color:'#6b7280'};
}

function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatNum(n){ n=n||0; if(n>=10000)return (n/10000).toFixed(1)+'w'; if(n>=1000)return (n/1000).toFixed(1)+'k'; return String(n); }
function normUrl(u){ if(!u)return ''; u=String(u).trim(); if(!u||u==='#'||/^javascript:/i.test(u))return ''; return u; }
function sanitize(html){
  const allowed=['br','strong','i','span','div','p','a','b','em','u','h1','h2','h3','h4'];
  const tmp=document.createElement('div'); tmp.innerHTML=html;
  (function clean(node){
    if(node.nodeType===3)return;
    if(node.nodeType===1){
      if(allowed.indexOf(node.tagName.toLowerCase())===-1){ node.parentNode.replaceChild(document.createTextNode(node.textContent),node); return; }
      for(let i=node.attributes.length-1;i>=0;i--){ const a=node.attributes[i]; if(a.name.indexOf('on')===0)node.removeAttribute(a.name); if(node.tagName==='A'&&a.name==='href'&&/^\s*javascript:/i.test(a.value))node.removeAttribute('href'); }
      Array.from(node.childNodes).forEach(clean);
    }
  })(tmp);
  return tmp.innerHTML;
}

function applyThemeColor(c1,c2){
  const r1=parseInt(c1.slice(1,3),16),g1=parseInt(c1.slice(3,5),16),b1=parseInt(c1.slice(5,7),16);
  const s=document.documentElement.style;
  s.setProperty('--accent',c1);
  s.setProperty('--accent2',c2);
  s.setProperty('--accent-soft','rgba('+r1+','+g1+','+b1+',.14)');
  s.setProperty('--accent-line','rgba('+r1+','+g1+','+b1+',.35)');
  s.setProperty('--accent-glow','rgba('+r1+','+g1+','+b1+',.25)');
}
function applyTheme(){
  const t=localStorage.getItem('themeData');
  if(t){ try{ const o=JSON.parse(t); applyThemeColor(o.c1,o.c2); return; }catch(e){} }
  applyThemeColor('#7a8cff','#4fd1c5');
}

function setHero(i,smooth){
  if(!heroSlides.length)return;

  const track=$('heroTrack');
  track.style.transition=smooth===false?'none':'transform .55s cubic-bezier(.22,.9,.28,1)';
  track.style.transform='translateX(-'+(heroIdx*100)+'%)';
  const dots=document.querySelectorAll('.hero-dot');
  for(let d=0;d<dots.length;d++) dots[d].classList.toggle('active',d===heroIdx);
}
function startHeroTimer(){

    const title = $('genTitleInput').value.trim()||'📢 公告';
    let body = v;
    try{ const parsed=JSON.parse(v); body = parsed.body||v; }catch(e){}
    setLS('announcementData',JSON.stringify({title, body}));
    if(genImgChanged){
      if(genImgData){ await App.dbSet('images','ann_img',genImgData); imgCache['ann_img']=genImgData; }
      else{ await App.dbDel('images','ann_img'); delete imgCache['ann_img']; }
    }
  }
  $('genOverlay').classList.remove('active');
  renderAll();
  App.toast('✅ 已保存');
}

function renderThemeColors(){
  let cur='';
  try{ const t=localStorage.getItem('themeData'); if(t){ cur=JSON.parse(t).n||''; } }catch(e){}
  let html='';
  THEMES.forEach(group=>{
    const groupName=group[0], list=group[1];
    html += '<div class="color-group-title">'+escapeHtml(groupName)+'</div>';
    list.forEach(t=>{
      const n=t[0],c1=t[1],c2=t[2];
      const active = n===cur ? ' active' : '';
      html += '<div class="color-dot'+active+'" data-n="'+escapeHtml(n)+'" data-c1="'+c1+'" data-c2="'+c2+'" style="background:linear-gradient(135deg,'+c1+','+c2+')" title="'+escapeHtml(n)+'"></div>';
    });
  });
  $('themeColors').innerHTML=html;
}

async function openCustPopup(){
  const img = imgCache['yz_popup'] || await App.dbGet('images','yz_popup');
  const c=$('custContent');
  if(img){
    c.innerHTML='<img src="'+img+'" alt=""/>'+
      '<div class="popup-actions">'+
        (isAdmin?'<label class="btn-save">📷 替换<input type="file" id="custUpload" accept="image/*"></label>':'')+

  }else{
    c.innerHTML='<div style="padding:40px 20px;text-align:center;color:var(--t3);font-size:12px;"><i class="fas fa-image" style="font-size:36px;opacity:.4;display:block;margin-bottom:10px;"></i>暂无客服图片</div>'+

      '</div>';
  }

    if(inp) inp.addEventListener('change',async function(){
      const f=this.files[0]; if(!f)return;
      const compressed=await App.compress(f,IMG_PRESET.cust);

      imgCache['yz_popup']=compressed;
      App.Cloud.schedule();

      $('custOverlay').classList.remove('active');
      refreshCustIcon();

function maybeShowAnnouncement(){
  let data;
  try{ const raw=localStorage.getItem('announcementData'); data=raw?JSON.parse(raw):DEFAULT_ANN; }catch(e){ data=DEFAULT_ANN; }
  if(!data.body || !String(data.body).trim()) return;
  const last=parseInt(localStorage.getItem('annShownAt')||'0',10);
  if(Date.now()-last < ANN_COOLDOWN) return;
  $('annTitle').textContent=data.title||'📢 公告';
  $('annBody').textContent=data.body;
  const annImg=imgCache['ann_img'];
  const annImgEl=$('annImage');
  if(annImg){ annImgEl.src=annImg; annImgEl.style.display='block'; }
  else { annImgEl.removeAttribute('src'); annImgEl.style.display='none'; }
  $('annOverlay').classList.add('active');
}

  });
  $('catMgrList').addEventListener('click',e=>{
    const del=e.target.closest('.del'); if(!del)return;
    const cat=del.dataset.cat;
    openConfirm('确定删除分类「<b>'+escapeHtml(cat)+'</b>」？',()=>{
      let cats=App.getCats();
      cats=cats.filter(c=>c!==cat);
      if(!cats.length) cats=['其他'];
      App.saveCats(cats);
      const projs=App.getProjects();
      Object.keys(projs).forEach(k=>{ if(projs[k].category===cat) App.updateProject(k,{category:cats[0]}); });
      renderCatMgr(); renderCats(); renderList();
      App.toast('🗑️ 已删除分类');
    });
  });
  $('catClose').addEventListener('click',()=>$('catOverlay').classList.remove('active'));
  $('catCloseX').addEventListener('click',()=>$('catOverlay').classList.remove('active'));

  /* 通用编辑 */
  $('genSave').addEventListener('click',saveGeneric);
  $('genCancel').addEventListener('click',()=>$('genOverlay').classList.remove('active'));
  $('genCloseX').addEventListener('click',()=>$('genOverlay').classList.remove('active'));
  
  /* Logo上传 */
  $('genLogoInput').addEventListener('change',function(){
    const f=this.files[0]; if(!f)return;
    App.compress(f,IMG_PRESET.logo).then(c=>{ genLogoData=c; genLogoChanged=true; updateGenLogoPreview(); });
    this.value='';
  });
  $('genLogoDel').addEventListener('click',()=>{ genLogoData=''; genLogoChanged=true; updateGenLogoPreview(); App.toast('🗑️ Logo已移除（保存生效）'); });

  /* 公告图片上传 */
  $('genImgInput').addEventListener('change',function(){
    const f=this.files[0]; if(!f)return;
    App.compress(f,IMG_PRESET.notice).then(c=>{ genImgData=c; genImgChanged=true; updateGenImgPreview(); });
    this.value='';
  });
  $('genImgDel').addEventListener('click',()=>{ genImgData=''; genImgChanged=true; updateGenImgPreview(); App.toast('🗑️ 图片已移除（保存生效）'); });

  /* 确认 */
  $('confirmOk').addEventListener('click',()=>{ const cb=confirmCb; confirmCb=null; $('confirmOverlay').classList.remove('active'); if(cb)cb(); });
  $('confirmCancel').addEventListener('click',()=>{ confirmCb=null; $('confirmOverlay').classList.remove('active'); });

  /* 公告确认 */
  $('annConfirm').addEventListener('click',closeAnn);
  $('annOverlay').addEventListener('click',e=>{ if(e.target===e.currentTarget)closeAnn(); });
}

async function init(){
  await App.openDB();
  await loadImages();
  App.Cloud.load();
  trackVisit();
  bindEvents();
  renderAll();
  if(CLOUD_ENABLED){
    await App.Cloud.init();
    await loadImages();
    renderAll();
  }
  setTimeout(()=>sweepOrphanImages(true), 3000);
  setTimeout(maybeShowAnnouncement, 600);
  console.log('✅ YZ 官网已启动');
}
init();

})();
</script>
</body>
</html>
